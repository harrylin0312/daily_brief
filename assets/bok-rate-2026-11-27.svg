<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460" role="img" aria-labelledby="t d"><title id="t">韓國政策利率由3.00%升至3.25%</title><desc id="d">2026年11月26日，增加0.25個百分點，即25基點。橫軸由零至4%。</desc><rect width="720" height="460" fill="#f1f1e8"/><g font-family="sans-serif" fill="#293b32"><text x="36" y="48" font-size="16">BANK OF KOREA / 2026.11.26</text><text x="36" y="91" font-size="28" font-weight="700">政策利率：3.00% → 3.25%</text><text x="36" y="127" font-size="18">增加 0.25 個百分點 = 25 基點</text><text x="36" y="196" font-size="20">決策前</text><text x="36" y="266" font-size="20">決策後</text><rect x="152" y="166" width="480" height="42" fill="white"/><rect x="152" y="166" width="360" height="42" fill="#87967e"/><text x="525" y="195" font-size="21">3.00%</text><rect x="152" y="236" width="480" height="42" fill="white"/><rect x="152" y="236" width="390" height="42" fill="#b64b2d"/><text x="554" y="265" font-size="21">3.25%</text><text x="152" y="316" font-size="16">0</text><text x="620" y="316" font-size="16">4%</text><rect x="36" y="345" width="648" height="66" rx="12" fill="white"/><text x="54" y="384" font-size="20">表決：5 位支持升息，2 位主張維持 3.00%</text><text x="36" y="439" font-size="13">來源：韓國央行 11/26 聲明 · Daily Brief 原創資訊圖</text></g></svg>