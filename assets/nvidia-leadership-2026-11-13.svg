<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 900 600" role="img">
<title>NVIDIA｜職務交接一圖看懂</title>
<rect width="900" height="600" fill="#f1f0e9"/>
<g font-family="PingFang TC, Microsoft JhengHei, sans-serif" fill="#252822">
<text x="40" y="49" font-size="18" letter-spacing="2" fill="#52654f">LEADERSHIP / 即刻生效</text>
<text x="40" y="100" font-size="36" font-weight="600">NVIDIA｜職務交接一圖看懂</text>
<rect x="40" y="128" width="820" height="116" rx="16" fill="#fff"/>
<rect x="40" y="128" width="8" height="116" rx="4" fill="#a34b35"/>
<text x="66" y="161" font-size="21" fill="#a34b35">辭任</text>
<text x="66" y="200" font-size="32" font-weight="600">黃仁勳 Jensen Huang</text>
<text x="66" y="229" font-size="20" fill="#60665c">卸下總裁、執行長及董事職務</text>
<rect x="40" y="261" width="820" height="116" rx="16" fill="#fff"/>
<rect x="40" y="261" width="8" height="116" rx="4" fill="#3e5945"/>
<text x="66" y="294" font-size="21" fill="#3e5945">暫代執行長</text>
<text x="66" y="333" font-size="32" font-weight="600">Colette Kress</text>
<text x="66" y="362" font-size="20" fill="#60665c">同時續任 CFO；永久接班人仍在搜尋</text>
<rect x="40" y="394" width="820" height="116" rx="16" fill="#fff"/>
<rect x="40" y="394" width="8" height="116" rx="4" fill="#3e5945"/>
<text x="66" y="427" font-size="21" fill="#3e5945">董事長</text>
<text x="66" y="466" font-size="32" font-weight="600">Harvey C. Jones</text>
<text x="66" y="495" font-size="20" fill="#60665c">董事會另行任命，與暫代 CEO 為不同職位</text>
<text x="40" y="560" font-size="19" fill="#60665c">人事交接已確認；此公告未公布獨立調查結論。</text>
<text x="40" y="588" font-size="14" fill="#60665c">DAILY BRIEF / 原創資訊圖 · 依 2026.11.12 官方公告整理</text>
</g></svg>