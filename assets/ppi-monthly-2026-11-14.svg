<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 900 600"><title>美國最終需求 PPI 月增率比較</title><rect width="900" height="600" fill="#f1f0e9"/><g font-family="PingFang TC,Microsoft JhengHei,sans-serif" fill="#252822"><text x="40" y="55" font-size="20">BLS / 2026 OCTOBER</text><text x="40" y="108" font-size="38" font-weight="600">月增放緩，不等於物價下跌</text><text x="40" y="149" font-size="23">最終需求 PPI · 季調月增率（%）</text><line x1="220" y1="190" x2="220" y2="358" stroke="#899181"/><g fill="#fff"><rect x="220" y="194" width="600" height="62"/><rect x="220" y="286" width="600" height="62"/></g><rect x="220" y="194" width="560" height="62" fill="#798d73"/><rect x="220" y="286" width="120" height="62" fill="#b84124"/><text x="40" y="235" font-size="28">9 月（修正）</text><text x="40" y="327" font-size="28">10 月</text><text x="787" y="236" font-size="25">1.4</text><text x="354" y="328" font-size="25">0.3</text><text x="216" y="391" font-size="20">0</text><text x="800" y="391" font-size="20">1.5</text><rect x="40" y="428" width="820" height="96" rx="16" fill="#fff"/><text x="65" y="466" font-size="25">另一個比較基準：10 月未季調年增 6.5%</text><text x="65" y="502" font-size="22" fill="#60665c">年比對照去年同月，不能與月比放在同一尺度混讀。</text><text x="40" y="566" font-size="18" fill="#60665c">來源：BLS 2026.11.13 發布 · Daily Brief 原創資訊圖</text></g></svg>