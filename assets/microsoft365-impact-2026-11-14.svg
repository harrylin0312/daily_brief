<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 900 600"><title>Microsoft 365 事故：影響與恢復狀態</title><rect width="900" height="600" fill="#f1f0e9"/><g fill="#252822" font-family="PingFang TC,Microsoft JhengHei,sans-serif"><text x="40" y="46" font-size="20">MO1550821 / 影響範圍分開看</text><text x="40" y="99" font-size="38" font-weight="600">服務恢復中 ≠ 事故已結案</text><rect x="40" y="130" width="820" height="112" rx="14" fill="#fff"/><rect x="40" y="130" width="8" height="112" fill="#b84124"/><text x="65" y="166" font-size="24" fill="#a23d26">受影響的核心與依賴功能</text><text x="65" y="202" font-size="30">Exchange 郵件、部分日曆與 Copilot</text><text x="65" y="229" font-size="19">信箱存取、延遲投遞，以及依賴郵件／工作資料的情境</text><rect x="40" y="262" width="820" height="112" rx="14" fill="#fff"/><rect x="40" y="262" width="8" height="112" fill="#3e5945"/><text x="65" y="298" font-size="24" fill="#3e5945">不能一概而論的服務</text><text x="65" y="334" font-size="30">Teams 多數通話、會議、一般聊天</text><text x="65" y="361" font-size="19">事故紀錄列為多數核心功能未受同一影響</text><rect x="40" y="394" width="820" height="112" rx="14" fill="#fff"/><rect x="40" y="394" width="8" height="112" fill="#996d29"/><text x="65" y="430" font-size="24" fill="#996d29">最新取得更新：臺灣 11 月 14 日 06:00</text><text x="65" y="466" font-size="30">持續恢復、監測穩定、處理郵件積壓</text><text x="65" y="493" font-size="19">未標為結案；不是對當下所有租戶可用性的保證</text><text x="40" y="548" font-size="18">資料：賓州大學公開轉載 Microsoft 事故更新 · 11 月 13 日 22:00 UTC</text><text x="40" y="580" font-size="17">DAILY BRIEF / 原創資訊圖 · 非事故照片</text></g></svg>