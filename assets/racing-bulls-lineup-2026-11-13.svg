<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 900 600" role="img">
<title>2027｜正賽與後備，角色不同</title>
<rect width="900" height="600" fill="#f1f0e9"/>
<g font-family="PingFang TC, Microsoft JhengHei, sans-serif" fill="#252822">
<text x="40" y="49" font-size="18" letter-spacing="2" fill="#52654f">F1 / CONFIRMED LINE-UP</text>
<text x="40" y="100" font-size="36" font-weight="600">2027｜正賽與後備，角色不同</text>
<rect x="40" y="128" width="820" height="116" rx="16" fill="#fff"/>
<rect x="40" y="128" width="8" height="116" rx="4" fill="#315b88"/>
<text x="66" y="161" font-size="21" fill="#315b88">Racing Bulls · 正賽席位</text>
<text x="66" y="200" font-size="32" font-weight="600">Liam Lawson</text>
<text x="66" y="229" font-size="20" fill="#60665c">續約留隊，2027 年延續原班搭檔</text>
<rect x="40" y="261" width="820" height="116" rx="16" fill="#fff"/>
<rect x="40" y="261" width="8" height="116" rx="4" fill="#315b88"/>
<text x="66" y="294" font-size="21" fill="#315b88">Racing Bulls · 正賽席位</text>
<text x="66" y="333" font-size="32" font-weight="600">Arvid Lindblad</text>
<text x="66" y="362" font-size="20" fill="#60665c">續約留隊，與 Lawson 搭檔出賽</text>
<rect x="40" y="394" width="820" height="116" rx="16" fill="#fff"/>
<rect x="40" y="394" width="8" height="116" rx="4" fill="#966b29"/>
<text x="66" y="427" font-size="21" fill="#966b29">Red Bull ＋ Racing Bulls · 共用後備</text>
<text x="66" y="466" font-size="32" font-weight="600">Nikola Tsolov</text>
<text x="66" y="495" font-size="20" fill="#60665c">待命替補、模擬器及測試；非全季正賽席位</text>
<text x="40" y="560" font-size="19" fill="#60665c">本圖僅呈現這次公告，未推論其他未公布席位。</text>
<text x="40" y="588" font-size="14" fill="#60665c">DAILY BRIEF / 原創資訊圖 · 依 2026.11.12 官方公告整理</text>
